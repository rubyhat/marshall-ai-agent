schema_version: 3

workflow_kit:
  source: "{{WORKFLOW_KIT_SOURCE}}"
  revision: "{{WORKFLOW_KIT_REVISION}}"
  installation_mode: "{{INSTALLATION_MODE}}"
  selected_modules: []

project:
  name: "{{PROJECT_NAME}}"
  product_type: "{{PRODUCT_TYPE}}"
  repositories: {}

language:
  interaction: "{{INTERACTION_LANGUAGE}}"
  project_docs: "{{PROJECT_DOCS_LANGUAGE}}"
  internal_memory: "{{INTERNAL_MEMORY_LANGUAGE}}"

interaction:
  clarifying_questions:
    options_per_decision: "2-3"
    recommended_option_first: true
  conflict_and_risk_gate:
    enabled: true

paths:
  root_instructions: "AGENTS.md"
  project_docs: "{{PROJECT_DOCS_ROOT}}"
  internal_memory: "{{INTERNAL_MEMORY_ROOT}}"
  project_topology: "{{PROJECT_TOPOLOGY_PATH}}"

protection:
  default_setup_boundary: enforced
  additional_restrictions: []

artifacts:
  output_contract:
    resolve_before_response: true
    explicit_user_form_precedence: true
    path_only_response_must_be_exact: true
  reports:
    root: "{{PROJECT_REPORTS_ROOT}}"
    chat_default: chat
    handoff_default: file
    incident_default: file
    file_response: concise_link_or_path

# Keep `memory` only when at least one context module is selected. Keep each
# child policy only with the exact module named in its comment.
memory:
  # load-project-context
  context_loading:
    preflight_large_or_mixed_artifacts: true
    section_targeting_required_when_available: true
    full_read_requires_identified_semantic_need: true
  # record-project-context
  context_recording:
    canonical_current_state_only: true
    task_chronology_in_canonical_forbidden: true
    update_existing_owner_before_create: true
  # maintain-project-context
  context_maintenance:
    manual_only: true
    audit_before_cleanup: true
    exact_manifest_approval_required: true
    section_level_compaction_for_mixed_canonical: true
    diagnostic_metrics_are_not_retention_rules: true

# Keep this section only when record-architecture-decision is selected.
architecture_decisions:
  enabled: true
  root: "{{ADR_ROOT}}"
  index: "{{ADR_INDEX_PATH}}"
  id_pattern: "{{ADR_ID_PATTERN}}"
  filename_pattern: "{{ADR_FILENAME_PATTERN}}"
  statuses:
    proposed: proposed
    accepted: accepted
    superseded: superseded
    deprecated: deprecated
    rejected: rejected
  decision_authority:
    - "{{ADR_DECISION_AUTHORITY}}"
  materiality_triggers:
    - "{{ADR_MATERIALITY_TRIGGER}}"
  supersession:
    material_change_creates_new_adr: true
    preserve_old_rationale: true
  applicability_review:
    before_forcing_task_conformance: true
    stop_on_unclear_or_review_required: true
    review_triggers:
      - "{{ADR_REVIEW_TRIGGER}}"
  bounded_exceptions:
    allowed: false
    owner_required: true
    expiry_or_review_trigger_required: true
  retrospective_recording:
    allowed: true
    requires_verifiable_rationale: true
    bulk_creation_forbidden: true

skills:
  active: {}

commands:
  aliases_are_plain_text: true
  aliases_do_not_expand_authority: true
  authority_resolution:
    order:
      - active_session_constraints
      - explicit_current_request
      - alias_or_workflow_contract
      - task_readiness
      - safety_policy
    sticky_negative_constraints_precede_alias_authority: true
    later_requests_may_narrow_but_not_implicitly_expand: true
    natural_language_requests_use_capability_gate: true
    authorized_handoffs_inherit_parent_capability_without_expansion: true
  session_profiles: {}
  sequence_guard:
    enabled: true
    stop_before_mutation_on_mismatch: true
    report_current_state_and_unmet_prerequisite: true
    recommend_exact_next_alias_or_action: true
  aliases: {}

# Add only sections required by selected modules.
